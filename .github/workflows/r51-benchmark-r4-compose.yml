name: Rezon R51 + Benchmark R4 no-commit composition

on:
  push:
    branches:
      - "qualification/r51-benchmark-r4-compose-20260919"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compose exact subjects without commit
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "3b9a0f36e0f1d1c60c7b3f79da6915f0b213476b" HEAD
          changed="$(git diff --name-only "3b9a0f36e0f1d1c60c7b3f79da6915f0b213476b"..HEAD)"
          test "${changed}" = ".github/workflows/r51-benchmark-r4-compose.yml"
          git cat-file -e "3b9a0f36e0f1d1c60c7b3f79da6915f0b213476b^{commit}"
          git cat-file -e "d7373867d3813d32032cb30463e54a6ddf573025^{commit}"
          git checkout --detach "3b9a0f36e0f1d1c60c7b3f79da6915f0b213476b"
          git config user.name "Rezon Qualification Runner"
          git config user.email "rezon-qualification@invalid.local"
          git merge --no-commit --no-ff "d7373867d3813d32032cb30463e54a6ddf573025"
          test "$(git rev-parse MERGE_HEAD)" = "d7373867d3813d32032cb30463e54a6ddf573025"
      - name: Install composed tree
        run: python -m pip install -e . pytest
      - name: Compile composed tree
        run: python -m compileall -q src tests scripts
      - name: Full composed suite
        run: pytest -q
      - name: Benchmark replay
        run: PYTHONPATH=src python scripts/run_benchmark_v1.py tests/fixtures/benchmark_v1.json tests/fixtures/benchmark_v1_clean_controls.json --seed 20260916 --code-version "R51+R4"
      - name: Staged merge diff integrity
        run: git diff --cached --check
      - name: Composition subjects
        run: |
          echo "R51=3b9a0f36e0f1d1c60c7b3f79da6915f0b213476b"
          echo "BENCHMARK_R4=d7373867d3813d32032cb30463e54a6ddf573025"
          echo "MERGE_HEAD=$(git rev-parse MERGE_HEAD)"
      - name: Abort ephemeral merge
        if: always()
        run: |
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          fi
