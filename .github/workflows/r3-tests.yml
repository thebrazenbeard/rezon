name: Rezon R3/R4 tests

on:
  push:
    branches:
      - work/rezon-kernel-v0-r3-mune-red
      - work/rezon-kernel-v0-r3-mune
      - rezon/kernel-v0-r4-hostile-hardening

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Diff check
        run: git diff --check
